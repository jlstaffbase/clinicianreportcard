<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinician homepage (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef3f3; --surface: #ffffff; --ink: #11262b; --muted: #5a6f74; --line: #d6e0e1;
  --teal: #0b7a75; --teal-soft: #dcf0ee; --amber: #a35f00; --amber-soft: #fbeccf;
  --coral: #b63a28; --coral-soft: #f9dfda; --track: #e2eaeb; --focus: #1d5fd1; --on-teal: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1a1d; --surface: #13262a; --ink: #e8f1f1; --muted: #93a9ad; --line: #28403f;
    --teal: #4fc9c0; --teal-soft: #17413f; --amber: #f0b45a; --amber-soft: #3b2d12;
    --coral: #ff8f7d; --coral-soft: #44211b; --track: #22393c; --focus: #8ab4ff; --on-teal: #06201e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1a1d; --surface: #13262a; --ink: #e8f1f1; --muted: #93a9ad; --line: #28403f;
  --teal: #4fc9c0; --teal-soft: #17413f; --amber: #f0b45a; --amber-soft: #3b2d12;
  --coral: #ff8f7d; --coral-soft: #44211b; --track: #22393c; --focus: #8ab4ff; --on-teal: #06201e;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2 { font-family: "Bricolage Grotesque", "Public Sans", sans-serif; letter-spacing: -0.015em; margin: 0; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
.top h1 { font-size: clamp(22px, 3.4vw, 30px); line-height: 1.2; font-weight: 700; }
.top p { margin: 6px 0 0; color: var(--muted); }
.caseload { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 16px; font-weight: 500; }
.caseload:hover { border-color: var(--teal); }

.grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }

/* tasks */
.tasks { padding: 22px 22px 14px; }
.progress { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.progress .bar { flex: 1; height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--teal); border-radius: 99px; transition: width .4s ease; }
.progress strong { font-family: "Bricolage Grotesque", sans-serif; font-size: 18px; white-space: nowrap; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--muted); font-weight: 500; }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.group { margin-top: 18px; }
.group h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.group h2 .n { font-family: "Public Sans", sans-serif; font-size: 12px; font-weight: 600; background: var(--track); color: var(--muted); border-radius: 99px; padding: 1px 8px; }
.group.overdue h2 { color: var(--coral); }
.group.overdue h2 .n { background: var(--coral-soft); color: var(--coral); }

.task { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.group h2 + .task { border-top: 0; }
.check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 7px; margin: 1px 0 0; cursor: pointer; display: grid; place-content: center; background: transparent; }
.check:checked { background: var(--teal); border-color: var(--teal); }
.check:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--on-teal); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check:disabled { border-style: dashed; cursor: default; opacity: .6; }
.ttitle { font-weight: 600; line-height: 1.35; }
.task.done .ttitle { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.tmeta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--muted); }
.src { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 99px; background: var(--track); color: var(--ink); }
.src.care { background: var(--teal-soft); color: var(--teal); }
.src.train { background: var(--amber-soft); color: var(--amber); }
.src.comp { background: var(--coral-soft); color: var(--coral); }
.due.late { color: var(--coral); font-weight: 600; }
.go { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 5px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.go:hover { border-color: var(--teal); color: var(--teal); }
.empty { color: var(--muted); padding: 10px 0 4px; }

/* report card */
.rc { padding: 22px; }
.rchead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.rchead h2 { font-size: 22px; }
.seg { display: inline-flex; background: var(--track); border-radius: 99px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 99px; color: var(--muted); font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.metric { padding: 12px 0; border-top: 1px solid var(--line); }
.mtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.mname { font-weight: 600; font-size: 14px; }
.mval { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; white-space: nowrap; }
.mval small { font-family: "Public Sans", sans-serif; font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 3px; }
.mbar { position: relative; height: 7px; background: var(--track); border-radius: 99px; margin: 9px 0 6px; }
.mfill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--teal); transition: width .5s ease; }
.mfill.near { background: var(--amber); }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .65; border-radius: 2px; }
.mnote { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.up { color: var(--teal); font-weight: 600; } .down { color: var(--coral); font-weight: 600; }
.nearhead { margin: 14px 0 0; font-size: 14px; font-weight: 600; color: var(--amber); }

.foot { margin: 14px 4px 0; color: var(--muted); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; max-width: 90vw; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="summary"></h1>
    </div>
    <button class="caseload" type="button" id="caseload">Open my caseload</button>
  </header>

  <div class="grid">
    <section class="card tasks" aria-labelledby="tasks-h">
      <div class="progress">
        <strong id="tasks-h">Your tasks</strong>
        <div class="bar" role="progressbar" aria-labelledby="tasks-h" id="pbar" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="pfill"></div></div>
        <span id="pcount" class="sub" style="margin:0"></span>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filter tasks by source"></div>
      <div id="groups"></div>
    </section>

    <section class="card rc" aria-labelledby="rc-h">
      <div class="rchead">
        <h2 id="rc-h">Report card</h2>
        <div class="seg" role="group" aria-label="Time range">
          <button type="button" data-range="week" aria-pressed="true">Week</button>
          <button type="button" data-range="month" aria-pressed="false">Month</button>
        </div>
      </div>
      <p class="sub" id="well-sub"></p>
      <div id="well"></div>
      <div id="near-wrap" hidden><p class="nearhead">Almost there</p><div id="near"></div></div>
    </section>
  </div>
  <p class="foot">Sample data for demo purposes. Tasks come from the systems Ivy Health already uses, in one list.</p>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const SOURCES = { care: "Patient care", train: "Training", comp: "Compliance", sched: "Scheduling", fac: "Facilities" };
const GROUPS = [
  { key: "overdue", label: "Overdue" },
  { key: "today", label: "Due today" },
  { key: "week", label: "Later this week" },
  { key: "wait", label: "Waiting on others" }
];

const tasks = [
  { id: 1, g: "overdue", src: "care",  title: "Sign 3 visit notes", due: "1 day overdue", late: true, go: "Review" },
  { id: 2, g: "overdue", src: "train", title: "Finish the annual privacy refresher", due: "2 days overdue", late: true, go: "Start" },
  { id: 3, g: "today",   src: "care",  title: "Recertify the plan of care for M. Alvarez", due: "Today", go: "Open" },
  { id: 4, g: "today",   src: "care",  title: "Call 4 patients who have 2 or fewer visits left", due: "Today", go: "See list" },
  { id: 5, g: "today",   src: "sched", title: "Confirm the Thursday schedule swap with Dana", due: "Today", go: "Reply" },
  { id: 6, g: "week",    src: "comp",  title: "Read and acknowledge the new fall-prevention protocol", due: "Fri", go: "Read" },
  { id: 7, g: "week",    src: "train", title: "Upload your CEU certificate", due: "Fri", go: "Upload" },
  { id: 8, g: "week",    src: "sched", title: "Request time off for the December holidays", due: "Next Mon", go: "Request" },
  { id: 9, g: "wait",    src: "care",  title: "Referral for R. Chen needs a physician signature", due: "Sent Monday to Dr. Patel’s office", wait: true },
  { id: 10, g: "wait",   src: "fac",   title: "Treadmill repair ticket in progress", due: "Facilities expects Wednesday", wait: true }
];

const metrics = [
  { name: "Visits completed", unit: "", target: 30,
    week: { v: 29, d: "+2 vs last week" }, month: { v: 121, t: 120, d: "+4 vs last month" } },
  { name: "Notes signed within 24 hours", unit: "%", target: 90,
    week: { v: 96, d: "+2 pts" }, month: { v: 93, d: "+1 pt" } },
  { name: "Patients who showed up", unit: "%", target: 88,
    week: { v: 92, d: "+3 pts" }, month: { v: 87, d: "−1 pt" } },
  { name: "Discharged with goals met", unit: "%", target: 75,
    week: { v: 78, d: "+1 pt" }, month: { v: 76, d: "+2 pts" } },
  { name: "Patient satisfaction", unit: " / 5", target: 4.5, max: 5,
    week: { v: 4.8, d: "+0.1" }, month: { v: 4.7, d: "no change" } }
];

const state = { range: "week", filter: "all", done: new Set() };
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function renderFilters() {
  const used = [...new Set(tasks.map(t => t.src))];
  const opts = [["all", "All"], ...used.map(k => [k, SOURCES[k]])];
  $("filters").innerHTML = opts.map(([k, l]) =>
    `<button type="button" data-f="${k}" aria-pressed="${state.filter === k}">${l}</button>`).join("");
}

function taskHTML(t) {
  const done = state.done.has(t.id);
  return `<div class="task ${done ? "done" : ""}">
    <input class="check" type="checkbox" data-id="${t.id}" ${done ? "checked" : ""} ${t.wait ? "disabled" : ""} aria-label="${done ? "Mark as not done" : "Mark as done"}: ${t.title}">
    <div>
      <div class="ttitle">${t.title}</div>
      <div class="tmeta"><span class="src ${t.src}">${SOURCES[t.src]}</span><span class="due ${t.late && !done ? "late" : ""}">${t.due}</span></div>
    </div>
    ${t.go && !done ? `<button class="go" type="button" data-go="${t.id}">${t.go}</button>` : "<span></span>"}
  </div>`;
}

function renderTasks() {
  const visible = tasks.filter(t => state.filter === "all" || t.src === state.filter);
  let html = "";
  GROUPS.forEach(g => {
    const items = visible.filter(t => t.g === g.key && !state.done.has(t.id));
    if (!items.length) return;
    html += `<div class="group ${g.key}"><h2>${g.label}<span class="n">${items.length}</span></h2>${items.map(taskHTML).join("")}</div>`;
  });
  const doneItems = visible.filter(t => state.done.has(t.id));
  if (doneItems.length) html += `<div class="group"><h2>Done<span class="n">${doneItems.length}</span></h2>${doneItems.map(taskHTML).join("")}</div>`;
  if (!html) html = `<p class="empty">Nothing here. Pick another source or enjoy the quiet.</p>`;
  $("groups").innerHTML = html;

  const mine = tasks.filter(t => !t.wait);
  const doneN = mine.filter(t => state.done.has(t.id)).length;
  $("pfill").style.width = (doneN / mine.length * 100) + "%";
  $("pbar").setAttribute("aria-valuenow", Math.round(doneN / mine.length * 100));
  $("pcount").textContent = `${doneN} of ${mine.length} done`;

  const late = mine.filter(t => t.g === "overdue" && !state.done.has(t.id)).length;
  const today = mine.filter(t => t.g === "today" && !state.done.has(t.id)).length;
  $("summary").textContent = late
    ? `${late} overdue and ${today} due today. Start with the overdue ones.`
    : today ? `Nothing overdue. ${today} due today.` : "You’re all caught up for today.";
}

function metricHTML(m) {
  const d = m[state.range], target = d.t ?? m.target;
  const max = m.max ?? (m.unit === "%" ? 100 : Math.max(target, d.v) * 1.15);
  const pct = Math.min(100, d.v / max * 100), tick = Math.min(100, target / max * 100);
  const goal = m.unit === "%" ? target + "%" : target;
  const cls = /no change/.test(d.d) ? "" : /^−/.test(d.d) ? "down" : "up";
  return `<div class="metric">
    <div class="mtop"><span class="mname">${m.name}</span><span class="mval">${d.v}${m.unit === "%" ? "%" : ""}<small>${m.unit === " / 5" ? "out of 5" : ""}</small></span></div>
    <div class="mbar" role="img" aria-label="${m.name}: ${d.v}, goal ${goal}"><div class="mfill ${d.v < target ? "near" : ""}" style="width:${pct}%"></div><div class="tick" style="left:${tick}%"></div></div>
    <div class="mnote"><span>Goal ${goal}</span><span class="${cls}">${d.d}</span></div></div>`;
}

function renderMetrics() {
  const good = [], near = [];
  metrics.forEach(m => { const d = m[state.range]; (d.v >= (d.t ?? m.target) ? good : near).push(m); });
  $("well").innerHTML = good.map(metricHTML).join("");
  $("near").innerHTML = near.map(metricHTML).join("");
  $("near-wrap").hidden = !near.length;
  $("well-sub").textContent = `Going well: ${good.length} of ${metrics.length} at or above goal.`;
}

$("filters").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  state.filter = b.dataset.f; renderFilters(); renderTasks();
});
$("groups").addEventListener("change", e => {
  if (!e.target.matches(".check")) return;
  const id = +e.target.dataset.id;
  e.target.checked ? state.done.add(id) : state.done.delete(id);
  renderTasks();
  if (e.target.checked) toast("Nice. Marked as done.");
});
$("groups").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (b) toast("Demo only: this opens the task in its own system.");
});
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  state.range = b.dataset.range;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderMetrics();
}));
$("caseload").addEventListener("click", () => toast("Demo only: this opens your caseload in the EMR."));

renderFilters(); renderTasks(); renderMetrics();
</script>
</body>
</html>
